  <meta name="theme-color" content="#1e1e2f" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">

  <link rel="manifest" href="manifest.json">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      transition: background-color 0.2s, color 0.2s, border-color 0.2s;
    }

    body.light {
      --bg: #f5f5f7;
      --surface: #ffffff;
      --text: #1c1c1e;
      --text-secondary: #3a3a3c;
      --border: #e5e5ea;
      --card-shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
      --header-bg: #f5f5f7cc;
      --footer-bg: #f5f5f7cc;
      --btn-bg: #e5e5ea;
      --btn-hover: #d1d1d6;
    }

    body, body.dark {
      --bg: #1e1e2f;
      --surface: #2c2c3a;
      --text: #f0f0f4;
      --text-secondary: #c6c6c8;
      --border: #3a3a4a;
      --card-shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
      --header-bg: #1e1e2fcc;
      --footer-bg: #1e1e2fcc;
      --btn-bg: #3a3a4a;
      --btn-hover: #4a4a5a;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
      padding: 0;
      margin: 0;
    }

    .app-header {
      padding: 1rem;
      background-color: var(--header-bg);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    button, .lang-btn {
      background-color: var(--btn-bg);
      border: none;
      padding: 0.4rem 0.8rem;
      border-radius: 40px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      color: var(--text);
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }

    button:hover, .lang-btn:hover {
      background-color: var(--btn-hover);
      transform: scale(0.97);
    }

    .lang-group {
      display: flex;
      gap: 0.3rem;
      flex-wrap: wrap;
    }

    .main-container {
      max-width: 1400px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    .food-slider {
      display: grid;
      grid-template-rows: repeat(4, auto);
      grid-auto-flow: column;
      grid-auto-columns: minmax(260px, 280px);
      gap: 1.25rem;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      padding-bottom: 1rem;
      scrollbar-width: thin;
    }

    .food-slider::-webkit-scrollbar {
      height: 6px;
    }

    .food-card {
      scroll-snap-align: start;
      background: var(--surface);
      border-radius: 28px;
      padding: 1rem;
      box-shadow: var(--card-shadow);
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .food-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 20px rgba(0, 0, 0, 0.2);
    }

    .food-image {
      width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: 20px;
      margin-bottom: 0.75rem;
      background-color: var(--btn-bg);
    }

    .food-emoji {
      font-size: 4rem;
      margin: 0.5rem 0;
    }

    .food-name {
      font-size: 1.3rem;
      font-weight: 600;
      margin: 0.5rem 0;
    }

    .food-desc {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-bottom: 0.75rem;
    }

    .detail-view {
      max-width: 1000px;
      margin: 1rem auto;
      background: var(--surface);
      border-radius: 32px;
      padding: 2rem;
      border: 1px solid var(--border);
    }

    .detail-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }

    .detail-image {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 24px;
      background: var(--btn-bg);
    }

    .detail-title {
      font-size: 2rem;
      font-weight: 700;
    }

    .section-title {
      font-size: 1.4rem;
      font-weight: 600;
      margin: 1.5rem 0 1rem 0;
      border-left: 4px solid #e67e22;
      padding-left: 0.75rem;
    }

    .detail-description {
      margin: 1rem 0;
      line-height: 1.6;
    }

    .tips {
      background: var(--btn-bg);
      padding: 1rem;
      border-radius: 20px;
      margin: 1rem 0;
      font-style: italic;
    }

    .city-shops {
      margin-bottom: 1.8rem;
    }

    .city-name {
      font-size: 1.2rem;
      font-weight: 600;
      margin: 1rem 0 0.5rem;
      color: #e67e22;
    }

    .shop-list {
      list-style: none;
      padding-left: 0;
    }

    .shop-list li {
      margin: 0.5rem 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px dashed var(--border);
      padding: 0.5rem 0;
    }

    .shop-info {
      flex: 1;
    }

    .shop-name {
      font-weight: 600;
      display: block;
      font-size: 1rem;
    }

    .shop-name small {
      font-weight: normal;
      font-size: 0.85rem;
    }

    .shop-desc {
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin-top: 0.2rem;
      line-height: 1.3;
    }

    .shop-link {
      color: #e67e22;
      text-decoration: none;
      font-size: 0.8rem;
      background: var(--btn-bg);
      padding: 0.2rem 0.7rem;
      border-radius: 30px;
      white-space: nowrap;
      margin-left: 0.5rem;
    }

    .shop-link:hover {
      text-decoration: underline;
    }

    .back-buttons {
      display: flex;
      gap: 1rem;
      margin-top: 2rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .back-btn {
      background-color: var(--btn-bg);
      padding: 0.6rem 1.2rem;
      font-size: 1rem;
      border-radius: 40px;
    }

    .app-footer {
      text-align: center;
      padding: 2rem 1rem;
      margin-top: 2rem;
      border-top: 1px solid var(--border);
      background-color: var(--footer-bg);
      font-size: 0.9rem;
    }

    .app-footer a {
      color: var(--text);
      text-decoration: none;
      font-weight: 500;
    }

    .app-footer a:hover {
      text-decoration: underline;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 700px) {
      .food-slider {
        grid-auto-columns: minmax(220px, 240px);
      }
      .detail-view {
        padding: 1.2rem;
      }
      .shop-list li {
        flex-direction: column;
      }
      .shop-link {
        align-self: flex-start;
        margin-left: 0;
        margin-top: 0.3rem;
      }
    }
  </style>
</head>

    // UI レンダリング関数
    function updateUILanguage() {
      document.getElementById('app-title').innerText = translations[currentLang].title;
      document.getElementById('footer-text').innerHTML = `${translations[currentLang].footer}<br><a href="mailto:mementomorikatsu@gmail.com">mementomorikatsu@gmail.com</a>`;
      document.getElementById('theme-toggle').innerText = translations[currentLang].themeBtn;
      renderHomeGrid();
      if (!document.getElementById('home-view').classList.contains('hidden')) return;
      const activeId = document.getElementById('detail-view').getAttribute('data-food-id');
      if (activeId) showDetailView(activeId);
    }

    function renderHomeGrid() {
      const container = document.getElementById('food-slider');
      container.innerHTML = '';
      foodData.forEach(food => {
        const card = document.createElement('div');
        card.className = 'food-card';
        card.setAttribute('data-id', food.id);
        const displayName = foodNames[currentLang]?.[food.id] || food.id;
        const descText = (descriptions[currentLang]?.[food.keyDesc] || '').substring(0, 75);
        const imgHtml = `<div class="food-emoji">${food.emoji}</div>`;
        card.innerHTML = `${imgHtml}<div class="food-name">${displayName}</div><div class="food-desc">${descText}</div>`;
        card.addEventListener('click', () => showDetailView(food.id));
        container.appendChild(card);
      });
    }

    function showDetailView(foodId) {
      const food = foodData.find(f => f.id === foodId);
      if (!food) return;
      const foodName = foodNames[currentLang]?.[food.id] || food.id;
      const longDesc = descriptions[currentLang]?.[food.keyDesc] || '';
      const tips = descriptions[currentLang]?.[food.tips] || '';
      const shops = shopsData[food.id] || {};
      const cities = ['tokyo', 'osaka', 'kyoto', 'hiroshima', 'fukuoka'];
      let shopsHtml = '';
      for (let city of cities) {
        const cityList = shops[city];
        if (cityList && cityList.length > 0) {
          shopsHtml += `<div class="city-shops"><div class="city-name">${translations[currentLang].cities[city]}</div><ul class="shop-list">`;
          cityList.forEach(shop => {
            const nameDisplay = `${shop.name_en} <small>/${shop.name_ja}/</small>`;
            const descDisplay = `${shop.desc_en}<br><small>${shop.desc_ja}</small>`;
            shopsHtml += `<li><div class="shop-info"><span class="shop-name">${nameDisplay}</span><div class="shop-desc">${descDisplay}</div></div><a href="${shop.url}" target="_blank" rel="noopener" class="shop-link">${currentLang === 'ja' ? '公式サイト' : 'Official Site'}</a></li>`;
          });
          shopsHtml += `</ul></div>`;
        }
      }
      const imgHtml = `<div style="font-size:5rem">${food.emoji}</div>`;
      const detailHtml = `
        <div class="detail-header">${imgHtml}<div class="detail-title">${foodName}</div></div>
        <div class="detail-description">${longDesc}</div>
        ${tips ? `<div class="tips"><strong>${translations[currentLang].tipsLabel}</strong><br>${tips}</div>` : ''}
        <div class="section-title">🍽️ ${currentLang === 'ja' ? '有名店リスト' : 'Famous Restaurants'}</div>
        ${shopsHtml || '<p>' + (currentLang === 'ja' ? '店舗情報は準備中です' : 'Restaurant information coming soon') + '</p>'}
        <div class="back-buttons">
          <button class="back-btn" id="back-to-home">${translations[currentLang].backHome}</button>
          <button class="back-btn" id="back-previous">${translations[currentLang].backPrev}</button>
        </div>
      `;
      const detailDiv = document.getElementById('detail-view');
      detailDiv.innerHTML = detailHtml;
      detailDiv.setAttribute('data-food-id', food.id);
      document.getElementById('home-view').classList.add('hidden');
      detailDiv.classList.remove('hidden');
      document.getElementById('back-to-home').addEventListener('click', () => showHomeView());
      document.getElementById('back-previous').addEventListener('click', () => window.history.back());
      window.history.pushState({ view: 'detail', id: food.id }, '', `#${food.id}`);
    }

    function showHomeView() {
      document.getElementById('detail-view').classList.add('hidden');
      document.getElementById('home-view').classList.remove('hidden');
      window.history.pushState({ view: 'home' }, '', '#home');
      renderHomeGrid();
    }

    function initLangButtons() {
      const container = document.getElementById('lang-buttons');
      for (const [code, data] of Object.entries(languages)) {
        const btn = document.createElement('button');
        btn.className = 'lang-btn';
        btn.innerHTML = `${data.flag} ${data.label}`;
        btn.addEventListener('click', () => { currentLang = code; updateUILanguage(); });
        container.appendChild(btn);
      }
    }

    function initTheme() {
      const stored = localStorage.getItem('theme');
      if (stored === 'light') { document.body.classList.remove('dark'); document.body.classList.add('light'); } 
      else { document.body.classList.add('dark'); document.body.classList.remove('light'); }
      document.getElementById('theme-toggle').addEventListener('click', () => {
        const isDark = document.body.classList.contains('dark');
        if (isDark) { document.body.classList.replace('dark', 'light'); localStorage.setItem('theme', 'light'); } 
        else { document.body.classList.replace('light', 'dark'); localStorage.setItem('theme', 'dark'); }
      });
    }

    function route() {
      const hash = window.location.hash.slice(1);
      if (hash && hash !== 'home') { if (foodData.some(f => f.id === hash)) showDetailView(hash); else showHomeView(); } 
      else { showHomeView(); }
    }

    window.addEventListener('popstate', () => {
      if (!document.getElementById('home-view').classList.contains('hidden')) {
        if (window.location.hash === '#home') return;
        const id = window.location.hash.slice(1);
        if (id && foodData.some(f=>f.id===id)) showDetailView(id);
        else showHomeView();
      } else { if (window.location.hash === '#home') showHomeView(); else route(); }
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(err => console.log('SW error', err)); });
    }

    initLangButtons();
    initTheme();
    renderHomeGrid();
    route();
  </script>
